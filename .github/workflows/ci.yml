# The repo gate (CLAUDE.md, Commands, "Gate") on macOS, Linux and Windows (D412).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-compat compares against the tag v0.7.0.
          fetch-depth: 0

      # Installs the toolchain, components and targets rust-toolchain.toml names
      # (the aarch64-apple-darwin target is what the API pages build for, D303).
      - name: toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # docs/DECISIONS.md is a private agent doc, not in the repo, so the one test that
      # reads it is skipped here (D412); the local gate still runs it.
      - name: test
        run: cargo test --workspace --no-fail-fast -- --skip the_real_decisions_file_has_the_known_changing_rows

      - name: clippy (lune-ui-winit)
        run: cargo clippy -p lune-ui-winit --all-targets -- -D warnings

      - name: test (lune-ui-winit)
        run: cargo test -p lune-ui-winit

      - name: boundaries
        run: scripts/check-boundaries.sh

      - name: component index
        run: scripts/gen-component-index.sh --check

      # scripts/gen-decisions-index.sh --check is left out: it reads docs/DECISIONS.md,
      # which is not in the repo (D412). The local gate still runs it.

      - name: API docs
        run: scripts/gen-api-docs.sh --check

      - name: compatibility (API)
        run: scripts/check-compat.sh --api-only

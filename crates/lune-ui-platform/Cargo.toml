[package]
name = "lune-ui-platform"
description = "OS layer of the glass UI toolkit: the glass effect behind a transparent window, the tray item and the popover window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lune-ui-core = { path = "../lune-ui-core" }
winit = "0.30"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8.1"
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSRunningApplication",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSDictionary",
    "NSEnumerator",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSSet",
    "NSString",
    "NSValue",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIApplication",
    "UIGeometry",
    "UIPasteboard",
    "UIResponder",
    "UIScene",
    "UIScreen",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
    "objc2-core-foundation",
] }

[target.'cfg(target_os = "android")'.dependencies]
# The system clipboard through JNI (D9): the VM and the Application come from `ndk-context`, which
# `android-activity` (through winit) fills before `android_main`. Both are already in the lock.
jni = "0.22"
ndk-context = "0.1"

[target.'cfg(target_family = "wasm")'.dependencies]
# The web text bridge (a hidden textarea for composition and phone keyboards): the page's own DOM
# API, no `unsafe`.
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CompositionEvent",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    "Node",
    "Window",
] }

[lints]
workspace = true

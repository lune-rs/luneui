[package]
name = "demo"
description = "A small phone app on the toolkit (three tabs from its public components): for the phone targets and the desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lune-ui = { path = "../../crates/lune-ui" }
winit = "0.30"
wgpu = "30"
# Time since start is the frame's time: std's `Instant` on every target but the browser, where it
# panics (`web_time::Instant` is std's own type elsewhere).
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "HtmlCanvasElement", "Location", "NodeList", "Window"] }

[features]
# The accessibility bridge (the facade's `accesskit`): a feature, not a dependency of its own.
access = ["lune-ui/accesskit"]

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }

[lints]
workspace = true

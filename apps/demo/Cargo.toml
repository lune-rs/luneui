[package]
name = "demo"
description = "Smallest consumer of the toolkit: one window, one frame, for the phone targets and the desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lune-ui = { path = "../../crates/lune-ui" }
winit = "0.30"
wgpu = "30"
pollster = "0.4"

[features]
# The accessibility bridge (the facade's `accesskit`): a feature, not a dependency of its own.
access = ["lune-ui/accesskit"]

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }

[lints]
workspace = true

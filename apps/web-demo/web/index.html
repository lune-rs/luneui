<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>luneui web demo</title>
<link rel="preconnect" href="https://cdn.fonts.izzat.dev" crossorigin>
<link rel="stylesheet" href="https://cdn.fonts.izzat.dev/rznsans/latest/web/rznsans.css">
<style>
  html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #status { position: fixed; top: 50%; left: 0; right: 0; transform: translateY(-50%); text-align: center; font: 14px RznSans, sans-serif; color: #9aa4b2; }
</style>
</head>
<body>
<canvas id="luneui" tabindex="0"></canvas>
<p id="status">Loading…</p>
<script type="module">
  import init from "./web-demo.js";
  const status = document.getElementById("status");
  const gl = document.createElement("canvas").getContext("webgl2");
  if (!navigator.gpu && !gl) {
    status.textContent = "This page needs WebGPU or WebGL2.";
  } else {
    init().then(() => status.remove(), (e) => { status.textContent = "Could not start: " + e; });
  }
</script>
</body>
</html>

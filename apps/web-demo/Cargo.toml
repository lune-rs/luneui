[package]
name = "web-demo"
description = "A fully animated showcase on the toolkit: glass over a moving background, six scenes; runs in a browser (WebGPU, WebGL2) and natively"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lune-ui = { path = "../../crates/lune-ui" }
winit = "0.30"
wgpu = "30"
# Time since start is the frame's time: std's `Instant` on every target but the browser, where it
# panics (`web_time::Instant` is std's own type elsewhere).
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "HtmlCanvasElement", "Location", "MediaQueryList", "Window"] }

[lints]
workspace = true
